name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate sources and release JAR
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" test build verifyReleaseJar --no-daemon --max-workers=1 --console=plain

      - name: Verify generated configuration reference
        run: python3 scripts/generate-config-reference.py --check

      - name: Check patch whitespace
        run: git diff --check

      - name: Upload release JAR
        uses: actions/upload-artifact@v7
        with:
          name: magnetization-release-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
