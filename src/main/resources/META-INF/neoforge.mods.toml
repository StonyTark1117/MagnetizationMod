modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "logo.png"
issueTrackerURL = "https://github.com/StonyTark1117/MagnetizationMod/issues"
displayURL = "https://github.com/StonyTark1117/MagnetizationMod"

# Defensive mixin against vanilla DependencySorter.isCyclic SOE — protects every
# cross-mod tag we reference from broken upstream tags (e.g. self-references).
# See DependencySorterCycleFixMixin.
[[mixins]]
config = "magnetization.mixins.json"

# Optional @Pseudo hook; harmless when Immersive Aeronautics is absent.
[[mixins]]
config = "magnetization.immersive_aeronautics.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.247,22.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
# Open upper bound: a future major (7.x) is far more likely to still work than to
# need us blocked from launching. Loose ranges avoid a hard lock-out on updates.
versionRange = "[6.0.11,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
# Open upper bound — a Sable major bump (3.x) shouldn't hard-block us from
# launching (the 2.x/aero update breakage taught us this). Loose by design.
versionRange = "[2.0.3,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "aeronautics"
type = "required"
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "simulated"
type = "required"
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

# Create: AeroPortals — optional cross-dimensional Sable ship transport.
# When present, Magnetization follows its transfer event to refresh derived
# ship state and remap railgun remote bindings. Open upper bound by design.
[[dependencies.${mod_id}]]
modId = "aeroportals"
type = "optional"
versionRange = "[1.2.3,)"
ordering = "AFTER"
side = "BOTH"

# Immersive Aeronautics — Immersive Portals fork with native Sable ship
# traversal. Its published project version is 1.1.0, while its runtime core mod
# reports 6.0.7. Open upper bound by design.
[[dependencies.${mod_id}]]
modId = "immersive_portals_core"
type = "optional"
versionRange = "[6.0.7,)"
ordering = "AFTER"
side = "BOTH"

# Create: Coasters Simulated — optional Sable coaster-cart integration. Coaster
# carts can react to magnetic fields and be adopted by Structural Inducers.
[[dependencies.${mod_id}]]
modId = "simulatedcoasters"
type = "optional"
versionRange = "[0.1.4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[15.10.5,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "waila"
type = "optional"
versionRange = "[12.10.2,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "theoneprobe"
type = "optional"
versionRange = "[12.0.8,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19.42.0.388,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "roughlyenoughitems"
type = "optional"
versionRange = "[17.0.807,)"
ordering = "AFTER"
side = "CLIENT"

# Iris — client-only shaders mod. Declared optional + CLIENT so it never affects
# the dedicated server or load order on it; purely so we advertise compatibility
# and sit AFTER it on the client.
[[dependencies.${mod_id}]]
modId = "iris"
type = "optional"
versionRange = "[1.8.14-beta.1,)"
ordering = "AFTER"
side = "CLIENT"

# Just Enough Resources — JEI add-on that surfaces ore-distribution graphs
# and mob loot tables. Optional; the addon registers magnetite distributions
# only when JER is installed.
[[dependencies.${mod_id}]]
modId = "jeresources"
type = "optional"
versionRange = "[1.6.0.17,)"
ordering = "AFTER"
side = "CLIENT"

# TerraBlender — required. Drives natural generation of the Magnetic Anomaly
# biome, and opens the door for other-mod biome interop (TerraBlender is the
# 1.21.1 ecosystem's de-facto biome injection lib, so being on it composes with
# Biomes O'Plenty, Terralith, etc.).
[[dependencies.${mod_id}]]
modId = "terrablender"
type = "required"
versionRange = "[4.1.0.8,)"
ordering = "BEFORE"
side = "BOTH"

# Create: The Factory Must Grow — optional. Supplies aluminium: gallium ingots
# can be re-smelted from aluminium ingots (#c:ingots/aluminum) and raw gallium
# drops as a byproduct of mining bauxite. Without TFMG, gallium comes entirely
# from Create's zinc, so this stays optional.
[[dependencies.${mod_id}]]
modId = "tfmg"
type = "optional"
versionRange = "[1.2.0,)"
ordering = "AFTER"
side = "BOTH"

# EMI — optional recipe viewer integration discovered through @EmiEntrypoint.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1.24,)"
ordering = "AFTER"
side = "CLIENT"

# Curios — optional equipment slots and key-driven grapple/repulsor actions.
[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[9.5.1,)"
ordering = "AFTER"
side = "BOTH"

# Patchouli — optional data-driven Field Manual.
[[dependencies.${mod_id}]]
modId = "patchouli"
type = "optional"
versionRange = "[1.21.1-93-neoforge,)"
ordering = "AFTER"
side = "BOTH"
