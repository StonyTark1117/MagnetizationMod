// ---------------------------------------------------------------------------
// Release smoke-test profiles (1.3.0 audit #10)
//
//   ./gradlew smokeServerMinimal   dedicated server, hard deps only — RELEASE GATE
//   ./gradlew smokeGameTest        headless GameTest suite          — RELEASE GATE
//   ./gradlew smokeClientNormal    client, hard deps only           — manual
//   ./gradlew smokeClientCompat    client + the whole compat pack   — manual
//   ./gradlew releaseGate          build + both automated gates
//
// The two automated gates are the ones that can fail a build. `smokeServerMinimal`
// boots a real dedicated server in its own directory, lets it run for a while, types
// `stop` on its console, and then fails if the log carries a FATAL, a stack trace, or
// (unless -PmagSmokeAllowErrors is passed) any ERROR line at all. Every dedicated-
// server defect this mod has shipped — client-only classes loading on the server,
// missing registry entries, capability registration order — announces itself in that
// log long before a player does.
// ---------------------------------------------------------------------------

/**
 * Stdin for the smoke server: blocks for a fixed window, then types `stop`.
 * A dedicated server has no other clean self-shutdown, and a gate that needs a human
 * to press a key is not a gate. The sleep happens on Gradle's stdin pump thread when
 * the stream is first read, i.e. only once the server process is actually running.
 */
class DelayedStopInput extends InputStream {
    private final long delayMs
    private final byte[] payload = "stop\n".getBytes("UTF-8")
    private int index = 0
    private boolean waited = false

    DelayedStopInput(long delayMs) { this.delayMs = delayMs }

    @Override
    int read() {
        if (!waited) {
            try { Thread.sleep(delayMs) } catch (InterruptedException ignored) { Thread.currentThread().interrupt() }
            waited = true
        }
        return index >= payload.length ? -1 : (payload[index++] & 0xFF)
    }
}

def smokeServerDir = file('run-smoke-server')
def smokeServerSeconds = ((findProperty('magSmokeSeconds') ?: '210') as String) as int
def smokeAllowErrors = findProperty('magSmokeAllowErrors') != null
// The remaining hard-dependency mixin configs probe this one client class during
// dedicated-server discovery. Match the complete logger + class + dist failure,
// and cap the known count, so a different side violation cannot hide behind a broad
// "invalid dist" substring. A lower count is accepted when upstream fixes probes.
def knownClientProbe = '[net.neoforged.fml.common.asm.RuntimeDistCleaner/DISTXFORM]: ' +
        'Attempted to load class net/minecraft/client/multiplayer/ClientLevel for invalid dist DEDICATED_SERVER'
def maxKnownClientProbes = 12

// A server refuses to boot without an accepted EULA. We never fabricate one — we copy
// the acceptance the developer already made for the normal `run/` directory, and fail
// with instructions if there isn't one.
def propagateEula = { File targetDir ->
    def target = new File(targetDir, 'eula.txt')
    if (target.exists() && target.text.contains('eula=true')) return
    def source = file('run/eula.txt')
    if (!source.exists() || !source.text.contains('eula=true')) {
        throw new GradleException(
                "smokeServerMinimal needs an accepted Minecraft EULA.\n" +
                "Run ./gradlew runServer once and accept it in run/eula.txt, or write " +
                "eula=true into ${target} yourself.")
    }
    targetDir.mkdirs()
    target.text = source.text
    logger.lifecycle("smokeServerMinimal: copied the accepted EULA from run/eula.txt")
}

tasks.matching { it.name == 'runServerSmoke' }.configureEach {
    standardInput = new DelayedStopInput(smokeServerSeconds * 1000L)
    doFirst {
        propagateEula(smokeServerDir)
        // Delete the previous log so the gate can never pass by reading a stale clean
        // run — an empty/missing log is treated as a failure below, not a pass.
        delete new File(smokeServerDir, 'logs/latest.log')
        logger.lifecycle("smokeServerMinimal: booting; will type `stop` after ${smokeServerSeconds}s")
    }
}

// ModDev's run task otherwise replaces stdin when launched through a Gradle
// daemon. The large-world supervisor owns this stream and uses it for Chunky
// commands and clean server shutdowns between phases.
tasks.matching {
    it.name == 'runLargeWorldBootstrapServer'
            || it.name == 'runLargeWorldFixtureServer'
            || it.name == 'runLargeWorldReproServer'
}.configureEach {
    standardInput = System.in
}

tasks.register('smokeServerMinimal') {
    group = 'verification'
    description = 'RELEASE GATE — boots a minimal dedicated server and fails on a dirty log.'
    dependsOn 'runServerSmoke'
    doLast {
        def log = new File(smokeServerDir, 'logs/latest.log')
        if (!log.exists() || log.length() == 0L) {
            throw new GradleException("smokeServerMinimal: no server log at ${log} — the server never got far enough to write one.")
        }
        def fatal = []
        def errors = []
        def knownProbes = 0
        log.eachLine('UTF-8') { line ->
            if (line.contains('/FATAL]') || line.contains('Exception in thread')
                    || line.contains('Failed to start the minecraft server')) {
                fatal << line
            } else if (line.contains('/ERROR]')) {
                if (line.contains(knownClientProbe)) knownProbes++
                else errors << line
            }
        }
        // Did it actually finish booting? A server killed early can leave a log with no
        // errors in it, which would otherwise read as a clean pass.
        def booted = log.text.contains('Done (') || log.text.contains('For help, type "help"')
        if (!booted) {
            throw new GradleException(
                    "smokeServerMinimal: the server never reported 'Done' — it did not finish loading " +
                    "within ${smokeServerSeconds}s. Raise the window with -PmagSmokeSeconds=<n> if the " +
                    "machine is just slow, otherwise read ${log}.")
        }
        if (knownProbes > maxKnownClientProbes) {
            throw new GradleException(
                    "smokeServerMinimal: ${knownProbes} known client-class probes exceeded the audited maximum " +
                    "of ${maxKnownClientProbes}; inspect dependency/runtime drift in ${log}.")
        }
        if (knownProbes > 0) {
            logger.lifecycle("smokeServerMinimal: recognized ${knownProbes}/${maxKnownClientProbes} exact hard-dependency ClientLevel probe(s).")
        }
        fatal.each { logger.error("  FATAL  ${it}") }
        errors.each { logger.error("  ERROR  ${it}") }
        if (!fatal.isEmpty()) {
            throw new GradleException("smokeServerMinimal: ${fatal.size()} fatal line(s) in the dedicated-server log (see above).")
        }
        if (!errors.isEmpty() && !smokeAllowErrors) {
            throw new GradleException(
                    "smokeServerMinimal: ${errors.size()} unexplained ERROR line(s) in the dedicated-server log (see above). " +
                    "Fix them, add a justified entry to smokeIgnoredErrors, or re-run with -PmagSmokeAllowErrors.")
        }
        logger.lifecycle("smokeServerMinimal: clean dedicated-server boot" +
                (errors.isEmpty() ? "." : " (${errors.size()} ERROR line(s) accepted via -PmagSmokeAllowErrors)."))
    }
}

