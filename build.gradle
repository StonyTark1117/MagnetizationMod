plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// Datagen output goes here; included in main resources so the built jar contains it.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// `localRuntime` lets us add an optional dependency to the in-dev run classpath
// (so /gradlew runClient loads it) WITHOUT publishing that dep to the
// runtimeElements variant — i.e. installed users won't be forced to also install
// the optional mod. Use it for soft-dep compats we want to smoke-test in dev.
configurations {
    localRuntime
    gameTestRuntime
    aeroportalsRuntime
    immersiveAeronauticsRuntime
    simulatedCoastersRuntime
    createBigCannonsRuntime
    createNewAgeRuntime
    cosmonauticsRuntime
    createAdditionRuntime
    immersiveEngineeringRuntime
    alexsCavesRuntime
    createTracksRuntime
    steamRailsRuntime
    dieselGeneratorsRuntime
    copycatsRuntime
    enchantmentIndustryRuntime
    enderTransmissionRuntime
    tfmgRuntime
    oreExcavationRuntime
    createOreExcavationRuntime
    // Dedicated-server-only aggregate used by the large-world regression
    // reproducer. Keep it separate from localRuntime: that configuration also
    // contains client-only renderers and recipe viewers.
    largeWorldReproRuntime {
        extendsFrom aeroportalsRuntime, immersiveAeronauticsRuntime,
                simulatedCoastersRuntime, createBigCannonsRuntime,
                createNewAgeRuntime, createAdditionRuntime,
                immersiveEngineeringRuntime, alexsCavesRuntime,
                createTracksRuntime, steamRailsRuntime,
                dieselGeneratorsRuntime, copycatsRuntime,
                enchantmentIndustryRuntime, enderTransmissionRuntime,
                tfmgRuntime
    }
    // Uses the same mod set while every Magnetization compatibility boolean is
    // disabled. This is essential: CNA's dense magnetite worldgen must exist in
    // the saved fixture before the all-enabled reload can exercise issue #7.
    largeWorldFixtureRuntime {
        extendsFrom largeWorldReproRuntime
    }
    // Sodium's Modrinth NeoForge "jar" is a thin JarJar wrapper: all real code —
    // including the net.caffeinemc.mods.sodium.api.* classes Iris hard-needs — lives
    // in nested META-INF/jarjar/*.jar files. In a normal client FML extracts those
    // from the mods folder, but the dev flat classpath does NOT: passing the wrapper
    // as a localRuntime "source" jar makes FML's JarSelector pick it and SKIP JarJar
    // extraction, so real Sodium never loads and Iris dies on a NoClassDefFoundError
    // for VertexSerializer. We resolve the wrapper into this separate config, unwrap
    // its nested jars (see unwrapSodium), and put the REAL jars on localRuntime.
    sodiumWrapper
}
// The soft-dep / smoke-test mods on localRuntime are the compatibility-heavy client
// pack we validate against in `./gradlew runClient` (Sodium, Iris, JEI, the tag-
// coverage mods, etc.). They must NOT be folded in for:
//   - `runData`: several are client-only and NPE in the headless data run (sodium /
//     immersive_aircraft call Minecraft.getInstance() during mod construction, null in datagen);
//   - `runServer` / `runGameTestServer`: a dedicated-server dist shouldn't load client-only
//     rendering mods — doing so spams `Attempted to load class .../client/... for invalid dist
//     DEDICATED_SERVER` and makes the automated GameTest gate a poor stand-in for a real
//     server. Keeping this classpath minimal (hard deps only) gives a clean physical-server run.
//   - the `smokeClientNormal` / `smokeServerMinimal` release profiles, whose whole point
//     is to prove the mod is healthy WITHOUT a compat pack propping it up.
// So only extend runtimeClasspath with localRuntime for the compat client run (and plain `build`).
def lowered = gradle.startParameter.taskNames.collect { it.toLowerCase() }
// Task-name suffixes that must run against hard dependencies only. Matched on the
// lowercased suffix so both `:runServer` and `runServer` forms hit.
def minimalProfileTasks = [
        'rundata',
        'runserver', 'rungametestserver', 'runoptionalcompatibilityabsentgametestserver',
        'runaeroportalsgametestserver',
        'runimmersiveaeronauticsgametestserver', 'runsimulatedcoastersgametestserver',
        'runcreatebigcannonsgametestserver',
        'runcreatenewagegametestserver',
        'runcosmonauticsgametestserver',
        'runcreateadditiongametestserver',
        'runimmersiveengineeringgametestserver',
        'runalexscavesgametestserver',
        'runcreatetracksgametestserver',
        'runsteamrailsgametestserver',
        'rundieselgeneratorsgametestserver',
        'runcopycatsgametestserver',
        'runenchantmentindustrygametestserver',
        'runendertransmissiongametestserver',
        'runtfmggametestserver',
        'runoreexcavationgametestserver',
        'runcreateoreexcavationgametestserver',
        'runcuriosgametestserver',
        'runlargeworldbootstrapserver', 'runlargeworldfixtureserver',
        'runlargeworldreproserver', 'reproducelargeworldissue',
        'smokeaeroportalsgametest', 'smokeimmersiveaeronauticsgametest',
        'smokesimulatedcoastersgametest', 'smokecreatebigcannonsgametest',
        'smokecreatenewagegametest', 'smokecreateadditiongametest',
        'smokecosmonauticsgametest',
        'smokeimmersiveengineeringgametest', 'smokealexscavesgametest',
        'smokecreatetracksgametest', 'smokesteamrailsgametest',
        'smokedieselgeneratorsgametest', 'smokecopycatsgametest',
        'smokeenchantmentindustrygametest', 'smokeendertransmissiongametest',
        'smoketfmggametest', 'smokeoreexcavationgametest', 'smokecreateoreexcavationgametest', 'smokecuriosgametest', 'smokeoptionalcompatibilityabsentgametest',
        'runserversmoke', 'runclientminimal',
        'smokeserverminimal', 'smokegametest', 'smokeclientnormal', 'releasegate'
]
def wantsMinimalClasspath = lowered.any { t -> minimalProfileTasks.any { m -> t.endsWith(m) } }
if (!wantsMinimalClasspath) {
    configurations.runtimeClasspath { extendsFrom configurations.localRuntime }
}
