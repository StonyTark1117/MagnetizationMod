        // `client` is the COMPATIBILITY-HEAVY client: everything on localRuntime
        // (Sodium/Iris/JEI/REI-adjacent/tag-coverage mods) rides along. Reach for
        // `smokeClientCompat` when that's what you mean.
        client { client() }
        // Same client, hard dependencies only — the classpath gate above drops
        // localRuntime for this task. Isolates "is this OUR bug?" from "is this the
        // compat pack?", which is the question every player report starts with.
        clientMinimal { client(); gameDirectory = file('run-smoke-client') }
        // Persistent, disposable manual-playtest worlds. Create one normal world
        // in each game directory on first launch; the preset stages itself on the
