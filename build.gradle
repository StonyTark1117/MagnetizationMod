    // already declared explicitly above, so keep these two artifacts isolated.
    implementation("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${aeronautics_version}") { transitive = false }
    implementation("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}") { transitive = false }

    // AeroPortals is optional for users. Compile against its public transfer
    // event so bindings can follow a relocated Sable plot, and load it only in
    // the dedicated compatibility GameTest profile.
    compileOnly("curse.maven:create-aeroportals-1549100:${aeroportals_test_file}") { transitive = false }
    aeroportalsRuntime("curse.maven:create-aeroportals-1549100:${aeroportals_test_file}") { transitive = false }

    // Immersive Aeronautics is optional for users. Compile against its internal
    // transfer bridge solely for the real integration GameTest; production code
    // reaches it through an optional @Pseudo mixin.
    compileOnly("curse.maven:immersive-aeronautics-1629108:${immersive_aeronautics_test_file}") { transitive = false }
    immersiveAeronauticsRuntime("curse.maven:immersive-aeronautics-1629108:${immersive_aeronautics_test_file}") { transitive = false }
    immersiveAeronauticsRuntime("me.shedaniel.cloth:cloth-config-neoforge:15.0.140")

    // Create: Coasters Simulated is optional for users. Compile against its cart
    // resolver and load the real release only in the dedicated compatibility suite.
    compileOnly("curse.maven:create-coasters-simulated-1601871:${simulated_coasters_test_file}") { transitive = false }
    simulatedCoastersRuntime("curse.maven:create-coasters-simulated-1601871:${simulated_coasters_test_file}") { transitive = false }

    compileOnly("curse.maven:create-new-age-905861:${create_new_age_test_file}") { transitive = false }
    createNewAgeRuntime("curse.maven:create-new-age-905861:${create_new_age_test_file}") { transitive = false }

    // Create: Cosmonautics is optional. Its exact published jar is loaded only
    // in the isolated compatibility suite; the production integration is
    // registry/tag/recipe based and has no hard linkage to addon classes.
    cosmonauticsRuntime("curse.maven:create-cosmonautics-1595491:${cosmonautics_test_file}") { transitive = false }

    compileOnly("maven.modrinth:createaddition:${createaddition_test_version}")
    createAdditionRuntime("maven.modrinth:createaddition:${createaddition_test_version}")

    immersiveEngineeringRuntime("maven.modrinth:immersiveengineering:${ie_test_version}") { transitive = false }
    alexsCavesRuntime("maven.modrinth:citadel-(1.21.1-port):${citadel_test_version}") { transitive = false }
    alexsCavesRuntime("maven.modrinth:alexs-caves-(unofficial-port):${alexscaves_test_version}") { transitive = false }

    compileOnly("curse.maven:create-tracks-1519765:${create_tracks_test_file}") { transitive = false }
    createTracksRuntime("curse.maven:create-tracks-1519765:${create_tracks_test_file}") { transitive = false }
    createTracksRuntime("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${offroad_test_version}") { transitive = false }

    compileOnly("curse.maven:steam-n-rails-neoforge-1414670:${steam_rails_test_file}") { transitive = false }
    steamRailsRuntime("curse.maven:steam-n-rails-neoforge-1414670:${steam_rails_test_file}") { transitive = false }

    compileOnly("curse.maven:create-diesel-generators-869316:${diesel_generators_test_file}") { transitive = false }
    dieselGeneratorsRuntime("curse.maven:create-diesel-generators-869316:${diesel_generators_test_file}") { transitive = false }

    compileOnly("maven.modrinth:UT2M39wf:${copycats_test_version}") { transitive = false }
    copycatsRuntime("maven.modrinth:UT2M39wf:${copycats_test_version}") { transitive = false }

    compileOnly("curse.maven:create-enchantment-industry-688768:${enchantment_industry_test_file}") { transitive = false }
    enchantmentIndustryRuntime("curse.maven:create-enchantment-industry-688768:${enchantment_industry_test_file}") { transitive = false }
    enchantmentIndustryRuntime("curse.maven:create-dragons-plus-1216624:${create_dragons_plus_test_file}") { transitive = false }

    compileOnly("curse.maven:create-ender-transmission-737302:${ender_transmission_test_file}") { transitive = false }
    enderTransmissionRuntime("curse.maven:create-ender-transmission-737302:${ender_transmission_test_file}") { transitive = false }

    // Ore Excavation is optional. Compile against its public excavation-start
    // event and load the real jar only in the isolated compatibility suite.
    compileOnly("curse.maven:ore-excavation-250898:${ore_excavation_test_file}") { transitive = false }
    oreExcavationRuntime("curse.maven:ore-excavation-250898:${ore_excavation_test_file}") { transitive = false }

    // Create: Big Cannons and its projectile library are optional. Keep both
    // artifacts out of normal client/server/build classpaths; this isolated
    // runtime exists only for the real CBC projectile GameTests.
    createBigCannonsRuntime("maven.modrinth:GWp4jCJj:${create_big_cannons_test_version}") { transitive = false }
    createBigCannonsRuntime("maven.modrinth:B3pb093D:${ritchies_projectile_test_version}") { transitive = false }

    // TerraBlender — biome injection (gates the Magnetic Anomaly biome into the
    // overworld). Hard dep so the region registers correctly on game load.
    implementation("maven.modrinth:terrablender:${terrablender_version}")

    // Jade — optional HUD overlay. compileOnly so we can write the plugin without
    // forcing Jade as a runtime dependency; the plugin class loads only when Jade
    // is present (its mod scans classes for @WailaPlugin).
    compileOnly("maven.modrinth:jade:15.10.6+neoforge")

    // WTHIT — alternative HUD. Same soft-dep pattern; plugin entry is declared in
    // waila_plugins.json so the class only loads when WTHIT is present.
    compileOnly("maven.modrinth:wthit:neo-12.10.2")
    // Loaded into runClient so the WTHIT plugin path can be tested in dev.
    // WTHIT has a hard dep on Bad Packets — without it WTHIT fails to load.
    localRuntime("maven.modrinth:wthit:neo-12.10.2")
    localRuntime("maven.modrinth:badpackets:neo-0.8.2")

    // The One Probe — third HUD. Soft-dep via IMC.
    compileOnly("maven.modrinth:the-one-probe:1.21_neo-12.0.8")

    // JEI — recipe browser. Soft-dep, plugin auto-discovered. Pulled from
    // BlameJared's maven (api-only artifact), which is published with NeoForge-
    // compatible mappings; the Modrinth mirror has classpath baggage that pulls
    // Yarn intermediary stubs.
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:19.43.0.394")
    // Full JEI build for dev runs — api-only doesn't include the mod entrypoint.
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:19.43.0.394")

    // REI — alternative recipe browser. Soft-dep; plugin discovered through
    // REI's @REIPluginClient annotation scanner.
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}")

    // Just Enough Resources (JER) — JEI add-on that shows ore distribution +
    // mob loot tables. Soft-dep; the @JERPlugin annotation is JER's discovery
    // mechanism (scanned at FMLCommonSetup), so without JER installed our
    // plugin class is never loaded and the missing imports don't matter.
    compileOnly("maven.modrinth:just-enough-resources-jer:${jer_version}")
    localRuntime("maven.modrinth:just-enough-resources-jer:${jer_version}")

    // EMI — third recipe viewer, common alongside JEI/REI. Soft-dep, plugin
    // discovered via @EmiEntrypoint. Modrinth maven (no separate api artifact —
    // single jar is fine for our compile usage).
    //
    // localRuntime intentionally commented out: JEI and EMI both shipped in the
    // same dev runtime produces duplicate recipe overlays and conflicting hotkey
    // bindings. The EMI plugin has been validated separately. To re-test it,
    // un-comment the localRuntime line below AND comment out the JEI + JER
    // localRuntime lines above.
    compileOnly("maven.modrinth:emi:${emi_version}")
    // localRuntime("maven.modrinth:emi:${emi_version}")

    // Curios API — slot extension framework. Soft-dep; our CurioItem capability
    // registration is gated on ModList.get().isLoaded("curios"), so the missing
    // class never resolves when Curios isn't installed.
    compileOnly("maven.modrinth:curios:${curios_version}")
    localRuntime("maven.modrinth:curios:${curios_version}")
    gameTestRuntime("maven.modrinth:curios:${curios_version}")

    // Patchouli — guide-book framework. Soft-dep, pure data-driven (book.json,
    // category JSONs, entry JSONs). No Java code needed — Patchouli auto-
    // registers the book item from the data/<modid>/patchouli_books/<name>/book.json
    // file on its own. We only need the dep at runtime so the book displays.
    localRuntime("maven.modrinth:patchouli:${patchouli_version}")

    // === Soft-dep test mods (localRuntime only — pulled in for runClient to
    // validate cross-mod tag entries + code integrations in-world). Comment
    // out any line to drop that mod from the test session. ===

    // Create: Crafts & Additions — kinetic ↔ FE bridge. Lets us test the FE/RF
    // alternative power source: build a windmill → Alternator → wire → Magnetic
    // Anchor → anchor activates without a redstone signal.
    localRuntime("maven.modrinth:createaddition:${createaddition_test_version}")

    // Immersive Engineering — tests our railgun + tesla-coil entries in the
    // lightning_sources damage-type tag, plus steel/aluminum/Faraday armor in
    // metal_armor, hammer/wirecutter/revolver/railgun in metal_tools.
    localRuntime("maven.modrinth:immersiveengineering:${ie_test_version}")

    // Alex's Caves (Unofficial Port) + Citadel — tests Magnetron + Ferrouslime
    // as magnetizable entities, azure/scarlet neodymium ores as ferromagnetic,
    // and the alexsCavesPotionMode config (BOTH/OURS_ONLY/THEIRS_ONLY).
    // Citadel is AC's hard dep (must come before AC in classpath order).
    localRuntime("maven.modrinth:citadel-(1.21.1-port):${citadel_test_version}")
    localRuntime("maven.modrinth:alexs-caves-(unofficial-port):${alexscaves_test_version}")

    // Applied Energistics 2 — needed to dev-test the meteorite Phase B AE2
    // scan hook (task #289). Pure reflection-based detection in our code, so
    // no compileOnly needed; AE2 only has to be on the runClient classpath
    // for the chunk-scan to find real AE2 meteorites to bind onto. AE2 hard-
    // deps on GuideME, which has to come along too.
    localRuntime("maven.modrinth:guideme:${guideme_test_version}")
    localRuntime("maven.modrinth:ae2:${ae2_test_version}")

    // === 1.1.2 cross-mod tag-coverage smoke-test mods ===
    // localRuntime only — they need to be present so the ferromagnetic_blocks /
    // ferromagnetic tag refs in our datapack resolve to real blocks/items at
    // tag-load time. Each entry tests a different category of integration
    // (decorative metalwork, falling blocks, tech metals, etc.). Twilight Forest
    // and Iron Chests both lack 1.21.1 NeoForge ports on Modrinth so they're
    // tag-supported but not dev-loadable.
    localRuntime("maven.modrinth:macaws-doors:u7BRX44F")
    localRuntime("maven.modrinth:macaws-fences-and-walls:jVdb0r4W")
    localRuntime("maven.modrinth:macaws-bridges:aQ7rY7ng")
    localRuntime("maven.modrinth:macaws-trapdoors:StnP0RNi")
    localRuntime("maven.modrinth:macaws-lights-and-lamps:5U2kQZIL")
    localRuntime("maven.modrinth:macaws-windows:rQUE4LCz")
    // Supplementaries + its Moonlight lib. These MUST stay current with Sodium:
    // Sodium 0.8 is a large rewrite from 0.6, and older Supplementaries builds
    // (we were pinned to 3.6.4) target the OLD Sodium fluid renderer, so their
    // `compat.CompatSodiumFluidRendererMixin` (@Inject require=1) matches 0 targets
    // against Sodium 0.8 and hard-crashes the client at world load. Bumped to a
    // Sodium-0.8-aware build. If you bump Sodium again, bump these to match.
    localRuntime("maven.modrinth:supplementaries:qvhtxmU6") // 1.21.1-3.8.8
    localRuntime("maven.modrinth:moonlight:in1fCzCm") // 1.21.1-3.3.2, Supplementaries hard dep
    // Sodium — the renderer most users run. localRuntime so we validate our
    // (and Sable's) mixin compatibility against it in dev. Latest 1.21.1 NeoForge
    // build; earlier Sable+Sodium-alpha clashes should be gone on Sable 2.x.
    // The Modrinth jar is a JarJar wrapper that doesn't unpack on the dev flat
    // classpath, so we resolve it into sodiumWrapper, unwrap the real nested mod
    // jars (unwrapSodium task), and add THOSE to localRuntime. Without this Iris
    // crashes runClient with NoClassDefFoundError on Sodium's api.* classes.
    sodiumWrapper("maven.modrinth:sodium:${sodium_version}")
    localRuntime(fileTree(sodiumUnwrapDir.get().asFile) { include '*.jar'; builtBy unwrapSodium })
    // Iris — shaders, on top of Sodium. localRuntime (client-only) so we validate
    // our render layers under shaders in dev. Declared optional/CLIENT in the
    // mods.toml; the runningDatagen guard above keeps it out of runData.
    localRuntime("maven.modrinth:iris:${iris_version}")
    // Aether intentionally disabled — its transitive `accessories` mod has a
    // broken mixin against this NeoForge build (EntityRenderers lambda
    // numbering mismatch crashes during render setup). Re-enable when the
    // upstream mod fixes it; tag coverage remains in place either way.
    // localRuntime("maven.modrinth:aether:K5X5qMwG")
    // localRuntime("maven.modrinth:owo-lib:NMCHU6DZ") // Aether hard dep
    localRuntime("maven.modrinth:sophisticated-storage:g3RpAmpe") // 1.21.1-1.5.85.2060
    localRuntime("maven.modrinth:sophisticated-core:JoVN8649") // 1.21.1-1.4.82.2230, Sophisticated Storage hard dep
    localRuntime("maven.modrinth:immersive-aircraft:RkWu0N4D") // 1.4.6+1.21.1
    // create-new-age 1.2.0 declares an OPTIONAL computercraft dep with range
    // [1.116.2,); NeoForge still enforces that range when CC is present. CC:Tweaked
    // arrives as an optional Maven POM transitive of aeronautics + simulated at
    // 1.115.1, which is below the range -> fatal pre-load. We force CC up to 1.116.2
    // (a 1.21.1 build; CC is only an optional integration for all involved mods) in
    // the resolutionStrategy near the top, so 1.2.0 loads cleanly.
    localRuntime("maven.modrinth:create-new-age:IwtuwMZy") // 1.2.0+mc1.21.1

    // Create: The Factory Must Grow (TFMG) — soft dep for gallium's aluminium
    // sourcing and bidirectional Hydrogen/gas-tag compatibility. Present in the
    // client pack and an isolated GameTest runtime; neither configuration ships.
    localRuntime("maven.modrinth:create-tfmg:uDi14nbt")
    tfmgRuntime("maven.modrinth:create-tfmg:uDi14nbt")

    // Create Ore Excavation — isolated recipe/data compatibility profile.
    createOreExcavationRuntime("curse.maven:create-ore-excavation-649832:${create_ore_excavation_test_file}") {
        transitive = false
    }

    // Full dedicated-server compatibility stack for the large-world issue #7
    // reproducer. Gameplay integrations are inherited from the isolated
    // runtimes above; these are the server-safe integrations and diagnostics
    // that do not otherwise have a dedicated runtime configuration.
    largeWorldReproRuntime("maven.modrinth:curios:${curios_version}")
    largeWorldReproRuntime("maven.modrinth:patchouli:${patchouli_version}")
    largeWorldReproRuntime("maven.modrinth:the-one-probe:1.21_neo-12.0.8")
    largeWorldReproRuntime("maven.modrinth:chunky:${chunky_test_version}")
    largeWorldReproRuntime("maven.modrinth:chunky-offline:${chunky_offline_test_version}")
    largeWorldReproRuntime("maven.modrinth:lithium:${lithium_repro_version}")
    largeWorldReproRuntime("maven.modrinth:modernfix:${modernfix_repro_version}")
    // === Crash-repro deps (player's modpack StackOverflowError in
    // DependencySorter.isCyclic at world create). Spartan pushes a tag-ref
    // `#spartan_weaponry_unofficial:quivers` into both curios:back and
    // curios:quiver; accessories_compat_layer's RuntimeTagModifier mirrors
    // curios↔accessories slot tags wholesale (including tag refs); the
    // combination plus our entries in shared curios slot tags closes a cycle.
    // Loaded only here so we can repro + verify the fix; comment out after
    // ship if undesired. ===
    localRuntime("maven.modrinth:accessories:Fb55Fgjz")
    localRuntime("maven.modrinth:accessories-compat-layer:JMgVNypu")
    localRuntime("maven.modrinth:owo-lib:NMCHU6DZ") // accessories-compat-layer hard dep
    localRuntime("maven.modrinth:spartan-weaponry-unofficial:I7KW38kf") // 1.21.1-1.2.2

    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// Run unit tests against the same Minecraft / dep classpath as main, so tests
// can reference Vec3, BlockPos, etc. without us having to re-stage dependencies.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

tasks.test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : version,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
