// CC:Tweaked rides in as an OPTIONAL Maven transitive of aeronautics + simulated at
// 1.115.1. The dev test mod create-new-age 1.2.0 enforces computercraft >=1.116.2
// (optional, but range-checked when present), so force CC up to a 1.21.1 build that
// satisfies it. CC is only an optional integration for every mod here, so this
// doesn't affect aeronautics/simulated behaviour.
configurations.all {
    resolutionStrategy {
        force 'cc.tweaked:cc-tweaked-1.21.1-forge:1.116.2'
        // Curios arrives as a Maven transitive of aeronautics + simulated at 9.2.2,
        // but neoforge.mods.toml declares `curios [9.5.1,)`. FML enforces an OPTIONAL
        // dependency's range whenever that mod IS present, so 9.2.2 on the classpath
        // is a hard "only supports curios 9.5.1 or above" load failure — caught by
        // `smokeServerMinimal`. Force the dev classpath up to the declared floor so
        // the runtime we test matches the runtime we advertise.
        force 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    }
}

// Reconstruct a dev-loadable Sodium from the Modrinth wrapper.
//
// The wrapper is NOT a thin shell: its top-level classes hold Sodium's
// compatibility/desktop/service layer (e.g. client.compatibility.workarounds.*),
// while the BULK of the engine (api.*, client.render.*, the sodium-*.mixins.json
// configs) lives in a nested META-INF/jarjar real jar that a custom
// IModFileCandidateLocator self-loads in a normal client. On the dev flat
// classpath that self-locate never fires, so half of Sodium is missing and its
// own mixins crash on ClassNotFound. We therefore:
//   1. explode the wrapper's nested jars (the real engine + 4 fabric-renderer shims),
//   2. MERGE the wrapper's own classes with the real engine jar into one mod jar
//      (dropping the self-locator service so it doesn't double-load), and
//   3. put that merged jar + the fabric shims on localRuntime.
def sodiumUnwrapDir = layout.buildDirectory.dir('sodium-unwrapped')
def sodiumPartsDir = layout.buildDirectory.dir('sodium-parts')

def explodeSodium = tasks.register('explodeSodium', Sync) {
    description = 'Extracts the nested real Sodium engine + fabric shim jars from the Modrinth wrapper.'
    from({ configurations.sodiumWrapper.collect { zipTree(it) } }) {
        include 'META-INF/jarjar/*.jar'
    }
    eachFile { it.relativePath = new RelativePath(true, it.name) }
    includeEmptyDirs = false
    into sodiumPartsDir
}

// Merge the wrapper's own classes with the nested engine jar into ONE sodium mod jar.
def mergeSodium = tasks.register('mergeSodium', Jar) {
    description = 'Merges the Sodium wrapper classes with its nested engine jar into one dev mod jar.'
    dependsOn explodeSodium
    archiveFileName = 'sodium-merged.jar'
    destinationDirectory = sodiumUnwrapDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Nested engine jar first → it wins ties (mods.toml, mixin configs, core classes).
    from({ fileTree(sodiumPartsDir).matching { include 'net.caffeinemc.sodium-neoforge-*.jar' }.collect { zipTree(it) } })
    // Wrapper classes second → adds the compatibility/desktop/service layer. Drop the
    // jarjar payload (merged in) and the self-locator (we provide everything flat).
    from({ configurations.sodiumWrapper.collect { zipTree(it) } }) {
        exclude 'META-INF/jarjar/**'
        exclude 'META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator'
        exclude 'META-INF/MANIFEST.MF'
    }
}

// Copy the fabric-renderer shims (separate forgified-fabric-api mods) alongside it.
def copySodiumShims = tasks.register('copySodiumShims', Copy) {
    dependsOn explodeSodium
    from(sodiumPartsDir) { include 'fabric-*.jar' }
    into sodiumUnwrapDir
}

def unwrapSodium = tasks.register('unwrapSodium') {
    description = 'Assembles the dev-loadable Sodium (merged engine + fabric shims).'
    dependsOn mergeSodium, copySodiumShims
}

// Only the compatibility-heavy client consumes the assembled Sodium jars.
// Server, minimal-client, and GameTest profiles deliberately exclude localRuntime.
tasks.matching { it.name == 'runClient' || it.name == 'runPlaytestLabClient'
        || it.name == 'runPlaytestSurvivalClient' }.configureEach { dependsOn unwrapSodium }

// GameTest hygiene: a previous gameTestServer JVM can LINGER (Sable's physics
// thread drags out shutdown) and then starve the next run's CPU and/or hold
// `run/world/session.lock`, which makes the new server crash on boot and/or
// false-fail timing-sensitive tests. Before launching a fresh gametest server,
// kill any leftover gametest JVM and clear a stale world lock. The match is
// SAFE — `-Dneoforge.gameTestServer=true` is a VM flag unique to the
// gameTestServer run type, so this never touches a runClient/runServer (or the
// Gradle daemon). doFirst runs before the JVM forks, so only PRIOR runs match.
// The `Dneoforge[.]gameTestServer=true` char-class regex matches that literal
// flag but NOT this command's own text (which carries the bracketed form), so
// pgrep can't self-match and kill its own shell.
tasks.matching { it.name == 'runGameTestServer' || it.name == 'runAeroPortalsGameTestServer'
        || it.name == 'runImmersiveAeronauticsGameTestServer'
        || it.name == 'runSimulatedCoastersGameTestServer'
        || it.name == 'runCreateBigCannonsGameTestServer'
        || it.name == 'runCosmonauticsGameTestServer'
        || it.name == 'runSteamRailsGameTestServer'
        || it.name == 'runDieselGeneratorsGameTestServer'
        || it.name == 'runCopycatsGameTestServer'
        || it.name == 'runEnchantmentIndustryGameTestServer'
        || it.name == 'runEnderTransmissionGameTestServer'
        || it.name == 'runTfmgGameTestServer'
        || it.name == 'runOreExcavationGameTestServer'
        || it.name == 'runCreateOreExcavationGameTestServer'
        || it.name == 'runCuriosGameTestServer' }.configureEach {
    doFirst {
        if (!org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            try {
                def killed = ['bash', '-c',
                    "pids=\$(pgrep -f 'Dneoforge[.]gameTestServer=true' || true); " +
                    "if [ -n \"\$pids\" ]; then echo \"\$pids\" | xargs -r kill -9; sleep 0.5; echo \"\$pids\"; fi"
                ].execute()
                killed.waitFor()
                def out = killed.text.trim()
                if (out) { logger.lifecycle("runGameTestServer: killed lingering gametest JVM(s): ${out.replaceAll('\\s+', ' ')}") }
            } catch (Exception e) {
                logger.warn("runGameTestServer: zombie-kill step failed (continuing): ${e.message}")
            }
        }
        def lock = file(it.name == 'runAeroPortalsGameTestServer'
                ? 'run-aeroportals-gametest/world/session.lock'
                : it.name == 'runImmersiveAeronauticsGameTestServer'
                ? 'run-immersive-aeronautics-gametest/world/session.lock'
                : it.name == 'runSimulatedCoastersGameTestServer'
                ? 'run-simulated-coasters-gametest/world/session.lock'
                : it.name == 'runCosmonauticsGameTestServer'
                ? 'run-cosmonautics-gametest/world/session.lock'
                : it.name == 'runCreateBigCannonsGameTestServer'
                ? 'run-createbigcannons-gametest/world/session.lock'
                : it.name == 'runSteamRailsGameTestServer'
                ? 'run-steam-rails-gametest/world/session.lock'
                : it.name == 'runDieselGeneratorsGameTestServer'
                ? 'run-diesel-generators-gametest/world/session.lock'
                : it.name == 'runCopycatsGameTestServer'
                ? 'run-copycats-gametest/world/session.lock'
                : it.name == 'runEnchantmentIndustryGameTestServer'
                ? 'run-enchantment-industry-gametest/world/session.lock'
                : it.name == 'runEnderTransmissionGameTestServer'
                ? 'run-ender-transmission-gametest/world/session.lock'
                : it.name == 'runTfmgGameTestServer'
                ? 'run-tfmg-gametest/world/session.lock'
                : it.name == 'runOreExcavationGameTestServer'
                ? 'run-ore-excavation-gametest/world/session.lock'
                : it.name == 'runCreateOreExcavationGameTestServer'
                ? 'run-create-ore-excavation-gametest/world/session.lock'
                : it.name == 'runCuriosGameTestServer'
                ? 'run-curios-gametest/world/session.lock'
                : 'run/world/session.lock')
        if (lock.exists()) {
            logger.lifecycle("runGameTestServer: removing stale world lock ${lock}")
            lock.delete()
        }
    }
}

// Substitute ${...} placeholders in neoforge.mods.toml at processResources time.
// Without this, runClient/runServer fail with `ParsingException: Invalid bare key: '${mod_id}'`
// because the toml is loaded literally from build/resources/main with no expansion.
processResources {
    // src/main/resources can override src/generated/resources for hand-written
    // files that supersede the data-generator output (e.g. loot tables that
    // need minecraft:copy_components which the standard dropSelf builder
    // doesn't emit). Without this Gradle hits a duplicate-resource error.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    final Map<String, String> replaceTokens = [
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_version      : mod_version,
        mod_group        : mod_group,
        mod_authors      : mod_authors,
        mod_description  : mod_description,
        mod_license      : mod_license,
        minecraft_version: minecraft_version,
        neoforge_version : neoforge_version,
        neoforge_min_version: neoforge_min_version,
        create_mod_version: create_mod_version,
        jade_min_version: jade_min_version,
        jei_min_version: jei_min_version
    ]
    inputs.properties(replaceTokens)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceTokens
    }
    // The isolated optional-test namespace needs the same empty arena without
    // committing a second binary NBT fixture.
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_aeroportals/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_compat_absent/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_immersive_aeronautics/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_simulatedcoasters/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_createbigcannons/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_create_new_age/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_cosmonautics/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_createaddition/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_immersiveengineering/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_alexscaves/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_createtracks/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_steam_rails/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
        into 'data/magnetization_diesel_generators/structure'
    }
    from('src/main/resources/data/magnetization/structure/empty.nbt') {
