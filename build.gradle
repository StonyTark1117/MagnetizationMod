// These profiles alter the shared runtimeClasspath for the whole Gradle process.
// Running two of them in one invocation silently contaminates the supposedly
// isolated classpaths (for example, `releaseGate smokeImmersiveAeronauticsGameTest`
// used to put Immersive Portals on the minimal dedicated server). Keep mixed
// invocations impossible and route the complete matrix through `releaseMatrixGate`,
// which launches a fresh Gradle process for each profile.
def wantsMinimalVerification = lowered.any {
    it.endsWith('releasegate') || it.endsWith('smokeserverminimal') || it.endsWith('smokegametest')
}
def optionalTestProfiles = [wantsAeroPortalsTests, wantsImmersiveAeronauticsTests,
                            wantsSimulatedCoastersTests, wantsCreateBigCannonsTests, wantsCreateNewAgeTests,
                            wantsCosmonauticsTests,
                            wantsCreateAdditionTests, wantsImmersiveEngineeringTests, wantsAlexsCavesTests,
                            wantsCreateTracksTests, wantsSteamRailsTests,
                            wantsDieselGeneratorsTests, wantsCopycatsTests, wantsEnchantmentIndustryTests,
                            wantsEnderTransmissionTests, wantsTfmgTests, wantsOreExcavationTests,
                            wantsCreateOreExcavationTests,
                            wantsLargeWorldFixture, wantsLargeWorldRepro]
        .count { it }
if ((wantsMinimalVerification && optionalTestProfiles > 0) || optionalTestProfiles > 1) {
    throw new GradleException('Incompatible verification profiles were requested in one Gradle invocation. ' +
            'Use ./gradlew releaseMatrixGate so minimal and optional compatibility profiles ' +
            'run with isolated classpaths.')
}
if (wantsImmersiveAeronauticsTests) {
    configurations.runtimeClasspath { extendsFrom configurations.immersiveAeronauticsRuntime }
}
if (wantsSimulatedCoastersTests) {
    configurations.runtimeClasspath { extendsFrom configurations.simulatedCoastersRuntime }
}
